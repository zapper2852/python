<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Drive — car, traffic and street life</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2310151c'/%3E%3Cpath%20d='M14%2040h4l3-8h18l3%208h8v6h-5a5%205%200%200%201-10%200H29a5%205%200%200%201-10%200h-5z'%20fill='%23e8b64c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" aria-live="polite">
      <div class="speed">
        <span id="speed-value">0</span>
        <span class="unit">km/h</span>
      </div>

      <dl class="telemetry">
        <div><dt>Gear</dt><dd><span id="gear-value">1</span></dd></div>
        <div><dt>Steering</dt><dd><span id="steer-value">0</span>°</dd></div>
        <div><dt>Motor torque</dt><dd><span id="torque-value">0</span> Nm</dd></div>
        <div><dt>Brake torque</dt><dd><span id="brake-value">0</span> Nm</dd></div>
      </dl>

      <p class="drive">Automatic 6-speed · rear-wheel drive</p>
    </div>

    <div id="minimap-panel">
      <canvas id="minimap"></canvas>
      <div id="minimap-info">Nearest fuel · —</div>
      <div class="minimap-key"><span class="fuel-dot"></span> Gas station</div>
    </div>

    <div id="controls">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — drive / walk</p>
      <p><kbd>Alt</kbd> — exit / enter car · <kbd>Shift</kbd> sprint · <kbd>Ctrl</kbd> crouch</p>
      <p><kbd>Space</kbd> — handbrake · <kbd>R</kbd> — reset · <kbd>Q</kbd><kbd>E</kbd> — look around on foot</p>
      <p><kbd>C</kbd> — camera view (chase / cockpit)</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
